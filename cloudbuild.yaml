steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/forex-service:$SHORT_SHA", "."]

  # Push the Docker image to Google Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/forex-service:$SHORT_SHA"]

  # Deploy to Google Compute Engine (GCE) - Option 1
  # - name: "gcr.io/cloud-builders/gcloud"
  #   args:
  #     - "compute"
  #     - "instances"
  #     - "update-container"
  #     - "forex-engine-instance"
  #     - "--zone=us-central1-a"
  #     - "--container-image=gcr.io/$PROJECT_ID/forex-service:$SHORT_SHA"

  # Deploy to Google Kubernetes Engine (GKE) - Option 2
  - name: "gcr.io/cloud-builders/kubectl"
    args:
      - "set"
      - "image"
      - "deployment/forex-deployment"  # Replace with your GKE deployment name
      - "forex-container=gcr.io/$PROJECT_ID/forex-service:$SHORT_SHA" # Replace forex-container with your container name
    env:
      - "CLOUDSDK_COMPUTE_ZONE=us-central1-a" # Replace with your GKE cluster zone
      - "CLOUDSDK_CONTAINER_CLUSTER=forex-cluster" # Replace with your GKE cluster name

images:
  - "gcr.io/$PROJECT_ID/forex-service:$SHORT_SHA"